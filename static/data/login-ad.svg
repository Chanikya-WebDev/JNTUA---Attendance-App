      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <g fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
